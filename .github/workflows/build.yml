name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          test -f nextone.zip
          unzip -q -o nextone.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: bash nextone/ci/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp nextone/build/app/outputs/flutter-apk/app-release.apk Nextone.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Nextone.apk --title "Nextone" --notes "Latest build" --latest
